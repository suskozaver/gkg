{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if setup %}
  <p class="muted">No account yet. The link to create it is in the container's log: <code>docker logs gkg</code>.</p>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" autocomplete="username" autocapitalize="none" autofocus required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
