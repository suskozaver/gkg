<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1440px;height:720px;background:#12110d;font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;color:#fff;display:flex;align-items:center;overflow:hidden}
.watch{margin-left:150px;width:520px;height:520px;border-radius:50%;background:#000;box-shadow:0 0 0 22px #2a2720,0 0 0 26px #3d3a2f;position:relative;flex:none}
.ring{position:absolute;inset:10px;border-radius:50%;border:10px solid #f9b600}
.hd{position:absolute;top:70px;width:100%;text-align:center}
.hd b{display:block;color:#f9b600;font-size:36px}
.hd span{color:#9e9e9e;font-size:26px}
.rows{position:absolute;top:175px;left:75px;right:75px}
.row{display:flex;align-items:center;gap:18px;height:64px;padding:0 22px;border-radius:16px;font-size:34px;font-weight:700;color:#9e9e9e}
.row.on{background:#1e1e1e;color:#fff}
.box{width:30px;height:30px;border-radius:7px;border:3px solid #9e9e9e;box-sizing:border-box;flex:none}
.on .box{border-color:#fff}
.done{color:#6b6b6b;text-decoration:line-through}
.done .box{background:#6b6b6b;border:0;position:relative}
.done .box::after{content:"";position:absolute;left:9px;top:4px;width:8px;height:15px;border:solid #000;border-width:0 4px 4px 0;transform:rotate(45deg)}
.txt{margin-left:130px}
.txt h1{font-size:120px;margin:0;line-height:1}
.txt h1 i{font-style:normal;color:#f9b600}
.txt p{font-size:44px;margin:24px 0 0;color:#e9e4d4;line-height:1.25;font-weight:400}
.txt small{display:block;margin-top:34px;font-size:28px;color:#8a846f}
</style></head><body>
<div class="watch"><div class="ring"></div>
 <div class="hd"><b>Shopping</b><span>2 of 4 open</span></div>
 <div class="rows">
  <div class="row on"><div class="box"></div>Bread</div>
  <div class="row"><div class="box"></div>Apples</div>
  <div class="row done"><div class="box"></div>Milk</div>
  <div class="row done"><div class="box"></div>Eggs</div>
 </div>
</div>
<div class="txt"><h1><i>GKG</i></h1><p>Your Google Keep lists<br>on the watch.<br>Tick them off from your wrist.</p><small>Pick the lists on gkg.wtf.si</small></div>
</body></html>
